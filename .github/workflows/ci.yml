name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · build + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # next build já corre o type-check do TypeScript.
      NEXT_TELEMETRY_DISABLED: "1"
      # Evita o download de browsers do Playwright no npm ci (só dev/local).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # getDb é lazy + páginas force-dynamic ⇒ o build não liga à BD; valor dummy só por segurança.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  workers:
    name: workers · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
