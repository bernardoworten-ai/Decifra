name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · build + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # next build já corre o type-check do TypeScript.
      NEXT_TELEMETRY_DISABLED: "1"
      # Evita o download de browsers do Playwright no npm ci (só dev/local).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # getDb é lazy + páginas force-dynamic ⇒ o build não liga à BD; valor dummy só por segurança.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  workers:
    name: workers · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  e2e-ui:
    name: web · e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: decifra
          POSTGRES_PASSWORD: decifra
          POSTGRES_DB: decifra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U decifra -d decifra"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://decifra:decifra@localhost:5432/decifra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright test

  workers-e2e:
    name: workers · e2e (integração determinística)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: decifra
          POSTGRES_PASSWORD: decifra
          POSTGRES_DB: decifra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U decifra -d decifra"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://decifra:decifra@localhost:5432/decifra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements-dev.txt
      # Migra + semeia a BD com as ferramentas do web…
      - run: npm ci
        working-directory: web
      - run: npm run db:migrate
        working-directory: web
      - run: npm run db:seed
        working-directory: web
      # …e corre a integração (o mockado passa; o live faz skip sem ICECAT_USERNAME).
      - run: pip install -r requirements-dev.txt
        working-directory: workers
      - run: pytest -m integration -q
        working-directory: workers
