name: Scheduled jobs (§3)

# Crons dos workers (Python). O preço live NUNCA entra em cron (§10) — é só on-demand.
# Cada job é idempotente e regista em ingestion_runs. Trigger manual via "Run workflow".
#
# SECRETS a criar em GitHub → Settings → Secrets and variables → Actions:
#   DATABASE_URL          (obrigatório) Postgres de produção (Supabase/Neon)
#   ICECAT_USERNAME       (recomendado) username Open Icecat — ex.: GCode420
#   ANTHROPIC_API_KEY     (opcional)    IA p/ rationale/resumos (recompute, reviews)
#   ANTHROPIC_MODEL       (opcional)    ex.: claude-haiku-4-5-20251001
#   DATAFORSEO_LOGIN      (opcional)    reviews por popularidade
#   DATAFORSEO_PASSWORD   (opcional)
#   AWIN_FEED_URL         (opcional)    feed batch de ofertas
#   SENTRY_DSN            (opcional)    observabilidade; sem isto, no-op
on:
  schedule:
    - cron: "0 4 * * *" # feed-batch — diário 04:00 UTC
    - cron: "0 5 10 * *" # score recompute mês — dia 10
    - cron: "0 6 1 1 *" # score recompute ano — 1 de janeiro
    - cron: "0 3 * * 1" # review refresh por popularidade — semanal (segunda)
  workflow_dispatch:
    inputs:
      job:
        description: "Job a correr manualmente"
        type: choice
        options: [feed-batch, score-month, score-year, review-popular]
        default: feed-batch

concurrency:
  group: scheduled-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: workers

jobs:
  feed-batch:
    if: github.event.schedule == '0 4 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'feed-batch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m decifra_workers feed-batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  score-month:
    if: github.event.schedule == '0 5 10 * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'score-month')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m decifra_workers score-recompute --period month
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  score-year:
    if: github.event.schedule == '0 6 1 1 *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'score-year')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m decifra_workers score-recompute --period year
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  review-popular:
    if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.job == 'review-popular')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m decifra_workers review-refresh-popular --limit 30
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
